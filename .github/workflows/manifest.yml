name: manifest

on:
  pull_request:
    paths:
      - "SYSTEM_MANIFEST.yaml"
      - "COMPATIBILITY.yaml"
      - "scripts/check_manifests.py"
      - "tests/test_check_manifests.py"
      - ".github/workflows/manifest.yml"
      - "firmware/**"
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/check_manifests.py
      - run: python -m unittest discover -s tests -p test_check_manifests.py -v
