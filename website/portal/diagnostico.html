<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="vapid-public" content="BNXGhPeU2YtDPokEZUYUuQjWBKC7p0Rf_YhtyBxMNrcIwqPSLGdKp4rF30axOCr2lQGEIADMped1jRIqxf6Ys_g">
<title>Diagnóstico - Seguimiento 360</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo-2026e.css">
<style>
  /* Ajustes propios del diagnostico, sobre la hoja compartida */
  .diag-fila {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border: 1px solid var(--linea);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 8px;
    gap: 14px;
  }
  .diag-fila .eti { font-size: 1rem; }
  .diag-fila .val { font-size: .95rem; font-weight: 600; white-space: nowrap; }
  .ok    { color: var(--ok); }
  .mal   { color: var(--err); }
  .aviso { color: var(--warn); }
  .neutro{ color: var(--txt2); }

  .diag-botones { margin-top: 18px; display: grid; gap: 10px; }
  .diag-botones button { width: 100%; }

  #log {
    margin-top: 18px; padding: 14px;
    background: #0b0f18; border-radius: 10px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: .85rem; color: #9fb0cc;
    white-space: pre-wrap; word-break: break-word;
    border: 1px solid var(--linea);
    max-height: 45vh; overflow-y: auto;
  }
  .oculto { display: none; }
</style>
</head>
<body>

<div id="cabecera"></div>

<main>
  <h2 class="titulo">Diagnóstico</h2>
  <p class="desc">Comprueba si este dispositivo puede recibir las alarmas</p>

  <div class="diag-fila"><span class="eti">Permiso de notificaciones</span><span class="val neutro" id="v-permiso">…</span></div>
  <div class="diag-fila"><span class="eti">Service Worker</span><span class="val neutro" id="v-sw">…</span></div>
  <div class="diag-fila"><span class="eti">Suscripción push</span><span class="val neutro" id="v-sub">…</span></div>
  <div class="diag-fila"><span class="eti">Sesión iniciada</span><span class="val neutro" id="v-sesion">…</span></div>
  <div class="diag-fila"><span class="eti">Usuario</span><span class="val neutro" id="v-usuario">…</span></div>

  <div id="zona-ios"></div>

  <div class="diag-botones">
    <button id="btn-activar">Activar notificaciones en este dispositivo</button>
    <button id="btn-probar" class="salir">Mostrar una notificación de prueba</button>
    <button id="btn-refrescar" class="salir">Volver a comprobar</button>
  </div>

  <div id="log" class="oculto"></div>
</main>

<script type="module">
import { cabecera, conectarSalir, exigirSesion } from '/portal/comun-2026b.js';

if (exigirSesion()) {
  const caja = document.getElementById('cabecera');
  if (caja) caja.innerHTML = cabecera('diagnostico');
  conectarSalir();
}
</script>

<script>
const $ = (id) => document.getElementById(id);

function log(texto) {
  const caja = $('log');
  caja.classList.remove('oculto');
  const hora = new Date().toLocaleTimeString();
  caja.textContent += '[' + hora + '] ' + texto + '\n';
  caja.scrollTop = caja.scrollHeight;
}

function pintar(id, texto, clase) {
  const el = $(id);
  el.textContent = texto;
  el.className = 'val ' + clase;
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const salida = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) salida[i] = raw.charCodeAt(i);
  return salida;
}

/* --- Deteccion de iOS ---
   En iPhone y iPad, Safari no entrega notificaciones push a una web normal:
   solo funciona si la app esta instalada en la pantalla de inicio. */
function esIOS() {
  const ua = navigator.userAgent || '';
  const iPhone = /iPhone|iPad|iPod/i.test(ua);
  // iPad moderno se identifica como Mac; se detecta por el tactil
  const iPadModerno = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
  return iPhone || iPadModerno;
}

function esStandalone() {
  return window.navigator.standalone === true ||
         window.matchMedia('(display-mode: standalone)').matches;
}

function avisoIOS() {
  const zona = $('zona-ios');
  if (!zona) return;

  if (!esIOS() || esStandalone()) { zona.innerHTML = ''; return; }

  zona.innerHTML =
    '<div class="aviso-push" style="margin-top:18px">' +
      '<div class="aviso-push-icono">📲</div>' +
      '<div class="aviso-push-texto">' +
        '<strong>En iPhone hay que instalar la app</strong>' +
        '<span>Safari no entrega notificaciones a una web abierta en el navegador. ' +
        'Para recibir las alarmas: toca <strong>Compartir</strong> (el cuadro con la flecha), ' +
        'elige <strong>Añadir a pantalla de inicio</strong> y abre la app desde ese icono. ' +
        'Después vuelve aquí y pulsa Activar.</span>' +
      '</div>' +
    '</div>';
}

async function revisar() {
  // 1. Permiso
  if (!('Notification' in window)) {
    pintar('v-permiso', 'no soportado', 'mal');
  } else if (Notification.permission === 'granted') {
    pintar('v-permiso', 'concedido', 'ok');
  } else if (Notification.permission === 'denied') {
    pintar('v-permiso', 'BLOQUEADO', 'mal');
  } else {
    pintar('v-permiso', 'sin decidir', 'aviso');
  }

  // 2. Service Worker
  let reg = null;
  if (!('serviceWorker' in navigator)) {
    pintar('v-sw', 'no soportado', 'mal');
  } else {
    try {
      reg = await navigator.serviceWorker.getRegistration();
      if (!reg) {
        log('Service Worker no encontrado. Registrando…');
        try {
          reg = await navigator.serviceWorker.register('service-worker.js');
          reg = await navigator.serviceWorker.ready;
          log('Service Worker activo.');
        } catch (e2) {
          log('FALLO al registrar: ' + e2.name + ' - ' + e2.message);
          reg = null;
        }
      }
      if (reg) {
        if (reg.active) pintar('v-sw', 'activo', 'ok');
        else if (reg.installing) pintar('v-sw', 'instalando', 'aviso');
        else if (reg.waiting) pintar('v-sw', 'en espera', 'aviso');
        else pintar('v-sw', 'registrado', 'aviso');
      } else {
        pintar('v-sw', 'error al registrar', 'mal');
      }
    } catch (e) {
      pintar('v-sw', 'error', 'mal');
      log('Error Service Worker: ' + e.name + ' - ' + e.message);
    }
  }

  // 3. Suscripcion
  if (!reg || !('PushManager' in window)) {
    pintar('v-sub', 'no disponible', 'mal');
  } else {
    try {
      const sub = await reg.pushManager.getSubscription();
      pintar('v-sub', sub ? 'activa' : 'ninguna', sub ? 'ok' : 'mal');
    } catch (e) {
      pintar('v-sub', 'error', 'mal');
    }
  }

  // 4. Sesion
  let token = null;
  try { token = localStorage.getItem('s360_token'); } catch (e) {}
  pintar('v-sesion', token ? 'sí' : 'NO', token ? 'ok' : 'mal');

  let usuario = null;
  try { usuario = JSON.parse(localStorage.getItem('s360_user') || 'null'); } catch (e) {}
  const nombre = usuario && (usuario.full_name || usuario.email);
  pintar('v-usuario', nombre || '—', usuario ? 'ok' : 'neutro');

  return { reg, token, usuario };
}

async function activar() {
  $('btn-activar').disabled = true;
  log('Iniciando activación…');

  try {
    if (esIOS() && !esStandalone()) {
      log('iPhone sin instalar: las notificaciones no llegarán hasta que');
      log('añadas el portal a la pantalla de inicio.');
    }

    const estado = await revisar();

    if (!estado.token) {
      log('AVISO: no hay sesión iniciada.');
    }

    if (!estado.reg) {
      log('Registrando Service Worker…');
      await navigator.serviceWorker.register('service-worker.js');
      await navigator.serviceWorker.ready;
      log('Service Worker listo.');
    }

    if (Notification.permission !== 'granted') {
      log('Pidiendo permiso…');
      const pedido = await Notification.requestPermission();
      log('Permiso: ' + pedido);
      if (pedido !== 'granted') {
        log('No se puede continuar sin permiso.');
        await revisar();
        $('btn-activar').disabled = false;
        return;
      }
    }

    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();

    if (sub) {
      log('Ya existía una suscripción.');
    } else {
      const meta = document.querySelector('meta[name="vapid-public"]');
      const clave = meta ? (meta.getAttribute('content') || '').trim() : '';
      if (!clave || clave.indexOf('PLACEHOLDER') === 0) {
        log('ERROR: falta la clave pública VAPID.');
        await revisar();
        $('btn-activar').disabled = false;
        return;
      }
      log('Suscribiendo…');
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(clave)
      });
      log('Suscripción creada.');
    }

    log('Endpoint: ' + sub.endpoint.slice(0, 55) + '…');

    if (estado.token) {
      log('Enviando al servidor…');
      const r = await fetch('/api/fcm/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + estado.token
        },
        body: JSON.stringify({ subscription: sub })
      });
      const texto = await r.text();
      log('Respuesta (' + r.status + '): ' + texto);
    } else {
      log('Sin sesión: no se envió al servidor.');
    }

    await revisar();
    log('Proceso terminado.');
  } catch (e) {
    log('ERROR: ' + e.message);
    await revisar();
  }

  $('btn-activar').disabled = false;
}

$('btn-activar').addEventListener('click', activar);
$('btn-refrescar').addEventListener('click', () => { revisar(); log('Comprobación repetida.'); });
$('btn-probar').addEventListener('click', async () => {
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('Seguimiento 360', {
      body: 'Notificación de prueba desde el diagnóstico',
      icon: '/portal/icono-192.png'
    });
    log('Notificación de prueba enviada.');
  } catch (e) {
    log('Error al mostrar la prueba: ' + e.message);
  }
});

avisoIOS();
revisar();
</script>

</body>
</html>
