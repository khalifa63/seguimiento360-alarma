services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=mi_alarma
      - DOCKER_INFLUXDB_INIT_BUCKET=gps_tracking
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_INIT_ADMIN_TOKEN}
      - INFLUXD_HTTP_CORS_ENABLED=true
      - INFLUXD_HTTP_CORS_ALLOWED_ORIGINS=*
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: always
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Bogota
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - TRACCAR_ADMIN_PASS=${TRACCAR_ADMIN_PASS}
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - nodered-data:/data

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
      - "8083:8083"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ./mosquitto/config:/mosquitto/config

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

  gotify:
    image: gotify/server
    container_name: gotify
    restart: always
    ports:
      - "8081:80"
    volumes:
      - gotify-data:/app/data
    environment:
      - GOTIFY_DEFAULTUSER_NAME=admin
      - GOTIFY_DEFAULTUSER_PASS=admin

  traccar:
    image: traccar/traccar:latest
    container_name: traccar
    restart: always
    ports:
      - "8082:8082"             # Interfaz Web
      - "5055:5055"   # Protocolos GPS (TCP)
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
      - ./traccar.xml:/opt/traccar/conf/traccar.xml:ro
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloud
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - default
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "8088:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro  
    networks:
      - default
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: traccar
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
volumes:
  influxdb-data:
  nodered-data:
  grafana-data:
  mosquitto-data:
  mosquitto-log:
  uptime-kuma-data:
  gotify-data:
  traccar-data:
  traccar-logs:
