<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel - Seguimiento 360</title>
<link rel="stylesheet" href="estilo-2026f.css">
<style>
  /* Boton discreto de la tarjeta del hub (fase12-dashboard) */
  .mini {
    background: none; border: 1px solid var(--linea); color: var(--txt2);
    border-radius: 7px; padding: 5px 10px; font-size: .78rem; cursor: pointer;
    font-family: inherit; line-height: 1.2;
  }
  .mini:hover:not(:disabled) { border-color: var(--acc); color: var(--txt); }
  .mini:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div id="cabecera"></div>
<main>
  <h2 class="titulo">Panel</h2>
  <p class="desc" id="sub">Resumen de tus sitios y dispositivos</p>
  <div id="zona-instalar"></div>
  <div id="aviso-push-zona"></div>
  <div id="contenido">
    <div class="cargando"><div class="girador"></div>Cargando...</div>
  </div>
</main>

<!-- Renombrar hub (fase12-dashboard): el nombre es lo unico editable, la
     MAC/serial es dato del instalador y no se muestra. -->
<div id="modal-hub" style="display:none;position:fixed;inset:0;
background:rgba(0,0,0,.65);align-items:center;justify-content:center;
padding:20px;z-index:50;">
  <div class="tarjeta" style="max-width:460px;">
    <h1 style="font-size:1.2rem;">Renombrar hub</h1>
    <p class="sub" id="h-sub" style="color:var(--txt2);font-size:.85rem;"></p>
    <p id="h-err" style="display:none;color:var(--err);font-size:.85rem;"></p>
    <form id="form-hub">
      <div class="campo">
        <label for="h-nombre">Nombre</label>
        <input type="text" id="h-nombre" required maxlength="64">
      </div>
      <button type="submit" class="btn" id="h-btn">Guardar</button>
      <button type="button" class="btn" id="h-cancelar"
              style="background:var(--panel2);margin-top:8px;">Cancelar</button>
    </form>
  </div>
</div>

<script type="module">
import { api, cabecera, conectarSalir, exigirSesion, esc, hace,
         evento, estadoEvento, fecha, avisoNotificaciones, avisoInstalar } from '/portal/comun-2026d.js';

if (!exigirSesion()) throw new Error('sin sesion');
document.getElementById('cabecera').innerHTML = cabecera('panel');
conectarSalir();

// Aviso si este dispositivo no tiene las notificaciones activadas
avisoInstalar('zona-instalar');
avisoNotificaciones('aviso-push-zona');

const cont = document.getElementById('contenido');

async function cargar() {
  try {
    const [ov, ev] = await Promise.all([
      api('/api/overview'),
      api('/api/events?limit=5')
    ]);

    const sitios = ov.sites || [];
    const hubs = sitios.flatMap(s => (s.hubs || []).map(hu =>
      Object.assign({}, hu, { sitio: s.site_name })));
    const nodos = hubs.flatMap(h => h.nodes || []);
    hubsLista = hubs;
    const armados = hubs.filter(h => h.alarm_state === 'armed').length;
    const activos = hubs.filter(h => h.hub_status === 'active').length;

    let h = '';

    /* --- Metricas --- */
    h += '<div class="rejilla d3" style="margin-bottom:24px;">';
    const m = [
      [nodos.length,  'Dispositivos',           'var(--acc)'],
      [hubs.length,   'Hubs',                   'var(--acc)'],
      [activos,       'Hubs en linea',          'var(--ok)'],
      [armados,       'Hubs armados',
        armados > 0 ? 'var(--err)' : 'var(--txt2)']
    ];
    for (const [n, etq, col] of m) {
      h += '<div class="bloque"><div class="metrica" style="color:' + col + '">'
         + n + '</div><div class="etq">' + etq + '</div></div>';
    }
    h += '</div>';

    /* --- Sitios --- */
    if (sitios.length === 0) {
      h += '<div class="bloque"><div class="vacio">Todavia no tienes sitios.'
         + '<br><br>Reclama tu hub con el codigo que viene en la caja.</div></div>';
    } else {
      for (const s of sitios) {
        h += '<div class="bloque" style="margin-bottom:16px;">';
        h += '<h3>📍 ' + esc(s.site_name) + '</h3>';
        const hs = s.hubs || [];
        if (hs.length === 0) {
          h += '<p style="color:var(--txt2);font-size:.9rem;">Sin hubs en este sitio.</p>';
        }
        for (const hub of hs) {
          const armado = hub.alarm_state === 'armed';
          const vivo = hub.hub_status === 'active';
          h += '<div style="background:var(--panel2);border-radius:8px;'
             + 'padding:14px;margin-top:10px;">';
          h += '<div style="display:flex;justify-content:space-between;'
             + 'align-items:center;flex-wrap:wrap;gap:8px;">';
          h += '<strong>' + esc(hub.hub_name) + '</strong>';
          h += '<span>';
          h += '<span class="pastilla ' + (vivo ? 'p-ok' : 'p-err') + '">'
             + (vivo ? 'en linea' : 'sin conexion') + '</span> ';
          h += '<span class="pastilla ' + (armado ? 'p-err' : 'p-gris') + '">'
             + (armado ? 'armado' : 'desarmado') + '</span> ';
          h += '<button class="mini" data-hub-editar="' + hub.hub_id
             + '">Renombrar</button>';
          h += '</span></div>';
          h += '<div style="color:var(--txt2);font-size:.82rem;margin-top:8px;">';
          h += 'Visto ' + hace(hub.last_seen) + '</div>';

          const ns = hub.nodes || [];
          if (ns.length) {
            h += '<div style="margin-top:10px;font-size:.88rem;">';
            for (const n of ns) {
              h += '<div style="display:flex;justify-content:space-between;'
                 + 'padding:6px 0;border-top:1px solid var(--linea);">';
              h += '<span>' + esc(n.node_name || n.node_mac) + '</span>';
              h += '<span style="color:var(--txt2);">'
                 + esc(n.room || n.location || '-') + '</span>';
              h += '</div>';
            }
            h += '</div>';
          } else {
            h += '<div style="color:var(--txt2);font-size:.85rem;'
               + 'margin-top:8px;">Sin dispositivos vinculados.</div>';
          }
          h += '</div>';
        }
        h += '</div>';
      }
    }

    /* --- Ultimos eventos --- */
    const lista = (ev.events || []).slice(0, 5);
    h += '<div class="bloque" style="margin-top:24px;">';
    h += '<h3>🕐 Ultimos eventos</h3>';
    if (lista.length === 0) {
      h += '<p style="color:var(--txt2);font-size:.9rem;">Sin actividad todavia.</p>';
    } else {
      h += '<div class="tabla-env" style="margin-top:10px;"><table>';
      h += '<thead><tr><th>Hora</th><th>Evento</th><th>Dispositivo</th>'
         + '<th>Detalle</th></tr></thead><tbody>';
      for (const e of lista) {
        const ev2 = evento(e.event_type);
        /* (fase14b) Estado legible segun el tipo de dispositivo; la
           logica vive en estadoEvento() (comun-2026d.js). */
        let det = estadoEvento(e);
        if (e.battery_level != null) {
          det += (det !== '-' ? ' · ' : '') + e.battery_level + '%';
        }
        h += '<tr><td data-etiqueta="Hora" class="mono">' + fecha(e.created_at) + '</td>';
        h += '<td data-etiqueta="Evento"><span class="pastilla ' + ev2.cls + '">' + ev2.txt + '</span></td>';
        h += '<td data-etiqueta="Dispositivo">' + esc(e.node_name || e.node_mac) + '</td>';
        h += '<td data-etiqueta="Detalle" style="color:var(--txt2);">' + det + '</td></tr>';
      }
      h += '</tbody></table></div>';
      h += '<p style="margin-top:12px;"><a href="/portal/eventos.html">'
         + 'Ver todos los eventos →</a></p>';
    }
    h += '</div>';

    cont.innerHTML = h;

    cont.querySelectorAll('[data-hub-editar]').forEach(b => {
      b.addEventListener('click', () => abrirHub(Number(b.dataset.hubEditar)));
    });
  } catch (err) {
    cont.innerHTML = '<div class="bloque"><div class="vacio">'
      + esc(err.message) + '</div></div>';
  }
}

/* ------------------------------------------------------------------ hubs */
/* (fase12-dashboard) Renombrar el hub desde el panel: PUT /api/hubs/:id
   cambia solo el nombre en la BD, igual que en la pantalla Nodos. La
   MAC/serial queda como dato de instalador en la BD. */
let hubsLista = [];
let hubEditando = null;
const modalHub = document.getElementById('modal-hub');

function abrirHub(id) {
  const hu = hubsLista.find(x => x.hub_id === id);
  if (!hu) return;
  hubEditando = hu;
  document.getElementById('h-sub').textContent = 'Hub ' + hu.hub_id
    + ' \u00B7 sitio ' + (hu.sitio || '-') + ' \u00B7 '
    + (hu.nodes || []).length + ' nodo(s)';
  document.getElementById('h-err').style.display = 'none';
  document.getElementById('h-nombre').value =
    hu.nombre === '(sin nombre)' ? '' : hu.nombre;
  modalHub.style.display = 'flex';
}
function cerrarHub() { modalHub.style.display = 'none'; hubEditando = null; }
document.getElementById('h-cancelar').addEventListener('click', cerrarHub);
modalHub.addEventListener('click', (e) => { if (e.target === modalHub) cerrarHub(); });

document.getElementById('form-hub').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!hubEditando) return;
  const nombre = document.getElementById('h-nombre').value.trim();
  const err = document.getElementById('h-err');
  if (!nombre) {
    err.textContent = 'El nombre no puede quedar vacio.';
    err.style.display = 'block';
    return;
  }
  const btn = document.getElementById('h-btn');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    await api('/api/hubs/' + hubEditando.hub_id,
              { method: 'PUT', body: { name: nombre } });
    cerrarHub();
    cargar();
  } catch (e2) {
    err.textContent = e2.message || 'No se pudo renombrar el hub.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
});

cargar();
</script>
</body>
</html>
